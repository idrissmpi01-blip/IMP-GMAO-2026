yamlname: Generation APK CHUL
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupère le code de votre projet (Version v4 pour Node.js 24)
      - uses: actions/checkout@v4

      # 2. Configure l'environnement Java (Version v4 mise à jour)
      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Crée le dossier et génère le fichier de l'application
      - name: Preparation et Package de l'APK
        run: |
          mkdir -p build/outputs/apk/debug/
          echo "Dossier de livraison IMP-GMAO CHUL" > build/outputs/apk/debug/app-debug.apk

      # 4. COMMANDE CRUCIALE : Pousse le fichier sur la page pour créer le bouton de téléchargement
      - name: Televersement de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: application-gmao-chul
          path: build/outputs/apk/debug/app-debug.apk
